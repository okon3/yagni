<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="YAGNI">
  <title>YAGNI</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b68ee" />
      <stop offset="1" stop-color="#5b47c4" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#g)" />
  <!-- Three staggered bars: the shape has to survive 16px, so they are thick,
       full-white and spaced by more than their own gap would suggest. -->
  <rect x="6" y="7" width="15" height="5" rx="2.5" fill="#fff" />
  <rect x="11" y="14" width="15" height="5" rx="2.5" fill="#fff" opacity="0.85" />
  <rect x="6" y="21" width="11" height="5" rx="2.5" fill="#fff" opacity="0.7" />
</svg>
